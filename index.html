<!DOCTYPE html>
<html lang="es" style="background-color: #000000;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>ImpactSampler Studio</title>
    <style>
      html, body {
        background-color: #000000 !important;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        z-index: 99999;
      }
      .loader-logo {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 1.875rem;
        line-height: 2.25rem;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-transform: uppercase;
        margin: 0;
        display: flex;
        align-items: center;
        filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.18));
      }
      .loader-logo span {
        color: #34d399;
        filter: drop-shadow(0 0 24px rgba(16, 185, 129, 0.75));
      }
      @media (min-width: 640px) {
        .loader-logo {
          font-size: 2.25rem;
          line-height: 2.5rem;
        }
      }
      @media (min-width: 768px) {
        .loader-logo {
          font-size: 3rem;
          line-height: 1;
        }
      }
    </style>
  </head>
  <body class="bg-black text-slate-100 select-none overflow-hidden antialiased" style="background-color: #000000;">
    <div id="root">
      <div id="initial-loader">
        <h1 class="loader-logo">IMPACT<span>SAMPLER</span></h1>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
