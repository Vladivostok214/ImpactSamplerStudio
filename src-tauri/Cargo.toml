[package]
name = "impact_sampler"
version = "1.0.0"
edition = "2024"
default-run = "impact_sampler"

[dependencies]
tauri = { version = "2.0.0", features = [] }
midir = "0.10"
cpal = "0.15"
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rustysynth = "1.3"
hound = "3.5"
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[[bin]]
name = "sniffer"
path = "src/bin/sniffer.rs"

[[bin]]
name = "impact_sampler"
path = "src/main.rs"

[[bin]]
name = "audio_test"
path = "src/bin/audio_test.rs"

[[bin]]
name = "gen_samples"
path = "src/bin/gen_samples.rs"

